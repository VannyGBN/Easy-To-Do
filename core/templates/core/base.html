{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Easy To Do{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="app-container">
        <nav class="navbar">
            <a href="{% url 'home' %}" class="navbar-brand">Easy To Do</a>
            <div class="navbar-links">
                <a href="#" class="nav-link">Iniciar Sesión</a>
                <a href="#" class="btn-primary" style="text-decoration: none;">Crear Cuenta</a>
            </div>
        </nav>

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer class="footer">
            <p>&copy; {% now "Y" %} Easy To Do. Todos los derechos reservados.</p>
        </footer>
    </div>

    {% block extra_js %}{% endblock %}
</body>

</html>
